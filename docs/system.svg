<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">SolarTrack Lab system architecture</title><desc id="desc">Environment drives the panel and evaluation oracle. True voltage and current feed noisy sensors, then a controller and bounded actuator. The oracle feeds metrics only. Generated files drive recorded web playback.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#637080"/></marker></defs><rect width="1000" height="330" rx="12" fill="#f6f8fa"/><g font-family="sans-serif" fill="#202c37" font-size="15"><g fill="white" stroke="#cbd4dc"><rect x="25" y="30" width="185" height="75" rx="8"/><rect x="280" y="30" width="185" height="75" rx="8"/><rect x="550" y="30" width="185" height="75" rx="8"/><rect x="25" y="205" width="185" height="80" rx="8"/><rect x="280" y="205" width="185" height="80" rx="8"/><rect x="550" y="205" width="185" height="80" rx="8"/><rect x="800" y="120" width="175" height="85" rx="8"/></g><text x="45" y="60">Prescribed environment</text><text x="45" y="85" font-size="12">G (W/m²), cell Tc (°C)</text><text x="300" y="60">Single-diode plant</text><text x="300" y="85" font-size="12">Independent I(V) solver</text><text x="570" y="60">Sensor model</text><text x="570" y="85" font-size="12">True V,I + paired noise</text><text x="45" y="235">Evaluation oracle</text><text x="45" y="260" font-size="12">Independent MPP search</text><text x="300" y="235">Bounded actuator</text><text x="300" y="260" font-size="12">0–50 V, slew ≤ 8 V/s</text><text x="570" y="235">Controller</text><text x="570" y="260" font-size="12">Fixed / P&amp;O / INC</text><text x="820" y="151">Metrics &amp; files</text><text x="820" y="176" font-size="12">CSV / JSON → dashboard</text><g stroke="#637080" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M210 67H280"/><path d="M465 67H550"/><path d="M642 105V205"/><path d="M550 245H465"/><path d="M370 205V105"/><path d="M115 105V205"/><path d="M210 282L790 282V185H800"/><path d="M735 67H887V120"/></g><text x="485" y="310" font-size="12" fill="#087f78">Oracle → metrics only. No oracle → controller signal.</text></g></svg>
