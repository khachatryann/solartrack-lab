<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">One causal sampled-control timestep</title><desc id="d">Solve true plant values at time k; sample sensors if due; update target if sampled; hold otherwise; rate limit actuator to time k plus one; accumulate true energy separately.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#637080"/></marker></defs><rect width="1000" height="250" rx="12" fill="#f6f8fa"/><g font-family="sans-serif" fill="#202c37"><text x="30" y="33" font-size="18">At each 0.05 s tick</text><g fill="white" stroke="#cbd4dc"><rect x="30" y="65" width="190" height="75" rx="8"/><rect x="280" y="65" width="190" height="75" rx="8"/><rect x="530" y="65" width="190" height="75" rx="8"/><rect x="780" y="65" width="190" height="75" rx="8"/></g><g font-size="14"><text x="46" y="95">Solve I at existing Vk</text><text x="46" y="120" font-size="12">Record true Pk = Vk Ik</text><text x="296" y="95">Is sensor sample due?</text><text x="296" y="120" font-size="12">0.10 / 0.25 / 0.50 s</text><text x="546" y="95">Update / hold target uk</text><text x="546" y="120" font-size="12">No oracle or G,T input</text><text x="796" y="95">Slew toward uk</text><text x="796" y="120" font-size="12">Next voltage Vk+1</text></g><g stroke="#637080" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M220 102H280"/><path d="M470 102H530"/><path d="M720 102H780"/><path d="M875 140V195H125V140"/></g><text x="280" y="222" fill="#087f78" font-size="13">Energy uses true power. Sensor noise affects decisions, not the energy formula.</text></g></svg>
